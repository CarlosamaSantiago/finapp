packages:
  - apps/*
  - packages/*
  - tools/*

# Pin exact versions on add (supply-chain rule in docs/ARCHITECTURE.md §6)
saveExact: true
# Refuse to install when Node doesn't match "engines"
engineStrict: true
patchedDependencies:
  better-sqlite3-multiple-ciphers@13.0.3: patches/better-sqlite3-multiple-ciphers@13.0.3.patch
# Install scripts are denied unless listed as true (least privilege).
allowBuilds:
  esbuild: false # postinstall only verifies the binary; platform packages provide it
