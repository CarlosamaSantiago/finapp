version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Same idea as pnpm's minimumReleaseAge: let new releases age before adopting them.
    cooldown:
      default-days: 3
    ignore:
      # typescript-eslint supports TypeScript <6.1 only (ADR 0001). Remove when that changes.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Types must match the Node major in .nvmrc, not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
